<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiderMan</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family:sans-serif;
            background-color: #8f2121;
            background-image: url("Spidernew.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.95);
        }

        .overlay {
            background-color: rgba(12, 6, 8, 0.65);
            min-height: 100vh;
        }

        .navbar {
            overflow: hidden;
            padding: 24px 50px;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.95);   
        }

        .logo {
            float: left;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
        }

        .logo span {
            color: #e62429;
        }

        .nav-links {
            float: right;
            padding-top: 5px;
        }

        .nav-links a {
            color: #e5e7eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-left: 26px;
            display: inline;
        }
        .nav-links a:hover {
            color: #e62429; 
        }
        .hero {
            text-align: center;
            padding: 120px 20px 80px 20px;
            max-width: 850px;
            margin: 0 auto;
        }
        .hero-tagline {
            font-family: serif;
            font-style: italic;
            font-size: 26px;
            color: #e62429; 
            margin: 0 0 16px 0;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .hero-title {
            font-size: 50px;
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 22px 0;
            color: #ffffff;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.95);
        }

        .hero-desc {
            font-size: 16px;
            line-height: 1.7;
            color: #d1d5db;
            max-width: 620px;
            margin: 0 auto 36px auto;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .btn1{
            display: inline-block;
            background-color: #e62429;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            padding: 16px 34px;
            border-radius: 4px;
            border: 2px solid #e62429;
            margin: 8px;
        }

        .btn1:hover {
            background-color: #b71c1c;
            border-color: #b71c1c;
            cursor: pointer;
        }

        .btn2 {
            display: inline-block;
            background-color: transparent;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 16px 34px;
            border-radius: 4px;
            border: 2px solid #ffffff;
            margin: 8px;
        }

        .btn2:hover {
            background-color: #ffffff;
            color: #111111;
            cursor: pointer;
        }
    </style>
</head>
<body>

        <div class="navbar">
            <div class="logo";">Spider<span>-Man</span></div>
            <div class="nav-links">
                <a href="">ORIGIN</a>
                <a href="">SUITS</a>
                <a href="">ABILITIES</a>
                <a href="">ROGUES</a>
                <a href="">COMICS</a>
            </div>
        </div>

        <div class="hero">
            <p class="hero-tagline">Your Friendly Neighborhood Hero</p>
            <h1 class="hero-title">WITH GREAT POWER COMES GREAT RESPONSIBILITY</h1>
            <p class="hero-desc">
                Got bite by a Radio Active spider not realize he's gonna be a superhero one day.
            </p>
            <a href="#explore" class="btn1">SWING INTO ACTION</a>
            <a href="#suits" class="btn2">EXPLORE SUITS</a>
        </div>

    

</body>
</html>
</html>
